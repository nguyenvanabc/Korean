<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seoul Trip - Firebase Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      color: #6b7280;
      margin: 0 0 25px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:hover {
      background: #f8f8f8;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .user-box {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 12px;
    }

    .user-name {
      font-size: 18px;
      font-weight: 600;
    }

    .user-email {
      margin-top: 5px;
      color: #666;
    }

    .uid {
      margin-top: 12px;
      font-size: 12px;
      color: #888;
      word-break: break-all;
    }

    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 8px;
      background: #ecfdf5;
      color: #047857;
      font-size: 14px;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      color: #666;
      min-height: 20px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- CHƯA ĐĂNG NHẬP -->
    <div id="login-prompt">

      <h1>Seoul Trip</h1>

      <p class="subtitle">
        Firebase Authentication Test
      </p>

      <button id="btn-login">
        Đăng nhập Google
      </button>

    </div>


    <!-- ĐÃ ĐĂNG NHẬP -->
    <div id="app-content" class="hidden">

      <h1>Đã đăng nhập 🎉</h1>

      <p class="subtitle">
        Firebase Authentication hoạt động bình thường.
      </p>

      <div class="user-box">

        <div id="user-name" class="user-name"></div>

        <div id="user-info" class="user-email"></div>

        <div id="user-uid" class="uid"></div>

      </div>

      <div class="status">
        ✓ Đã xác thực bằng Google
      </div>

      <div style="margin-top:20px;">
        <button id="btn-logout">
          Đăng xuất
        </button>
      </div>

    </div>


    <div id="message"></div>

  </div>


  <script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


    // =========================================================
    // FIREBASE CONFIG - SEOUL TRIP
    // =========================================================

    const firebaseConfig = {
      apiKey: "AIzaSyCoHYgOL4hAs4ECxz8iMrc8d9458dOth3Q",
      authDomain: "seol-8eb80.firebaseapp.com",
      projectId: "seol-8eb80",
      storageBucket: "seol-8eb80.firebasestorage.app",
      messagingSenderId: "545533388832",
      appId: "1:545533388832:web:441dad1a09916bb14eb445",
      measurementId: "G-MZQ5L465GV"
    };


    // =========================================================
    // INIT
    // =========================================================

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const provider = new GoogleAuthProvider();


    // =========================================================
    // VARIABLES
    // =========================================================

    let currentUser = null;


    // =========================================================
    // ELEMENTS
    // =========================================================

    const btnLogin = document.getElementById("btn-login");
    const btnLogout = document.getElementById("btn-logout");

    const loginPrompt = document.getElementById("login-prompt");
    const appContent = document.getElementById("app-content");

    const userName = document.getElementById("user-name");
    const userInfo = document.getElementById("user-info");
    const userUid = document.getElementById("user-uid");

    const message = document.getElementById("message");


    // =========================================================
    // ĐĂNG NHẬP GOOGLE
    // =========================================================

    btnLogin.addEventListener("click", async () => {

      try {

        btnLogin.innerText = "Đang xử lý...";
        btnLogin.disabled = true;

        message.innerText = "";

        await signInWithPopup(auth, provider);

      } catch (error) {

        console.error("Lỗi đăng nhập:", error);

        message.innerText =
          "Đăng nhập thất bại: " + error.message;

        btnLogin.innerText = "Đăng nhập Google";
        btnLogin.disabled = false;

      }

    });


    // =========================================================
    // ĐĂNG XUẤT
    // =========================================================

    btnLogout.addEventListener("click", async () => {

      try {

        btnLogout.innerText = "Đang xử lý...";
        btnLogout.disabled = true;

        await signOut(auth);

      } catch (error) {

        console.error("Lỗi đăng xuất:", error);

        message.innerText =
          "Đăng xuất thất bại: " + error.message;

        btnLogout.innerText = "Đăng xuất";
        btnLogout.disabled = false;

      }

    });


    // =========================================================
    // AUTH STATE
    // =========================================================

    onAuthStateChanged(auth, (user) => {

      currentUser = user;

      if (user) {

        // -----------------------------------------
        // ĐÃ ĐĂNG NHẬP
        // -----------------------------------------

        userName.innerText =
          user.displayName || "Google User";

        userInfo.innerText =
          user.email || "";

        userUid.innerText =
          "UID: " + user.uid;

        loginPrompt.classList.add("hidden");

        appContent.classList.remove("hidden");

        message.innerText = "";

        btnLogin.innerText = "Đăng nhập Google";
        btnLogin.disabled = false;

        btnLogout.innerText = "Đăng xuất";
        btnLogout.disabled = false;

        console.log("Firebase user:", user);

      } else {

        // -----------------------------------------
        // CHƯA ĐĂNG NHẬP
        // -----------------------------------------

        userName.innerText = "";
        userInfo.innerText = "Chưa đăng nhập";
        userUid.innerText = "";

        appContent.classList.add("hidden");

        loginPrompt.classList.remove("hidden");

        btnLogin.innerText = "Đăng nhập Google";
        btnLogin.disabled = false;

        console.log("Chưa đăng nhập");

      }

    });

  </script>

</body>
</html>
