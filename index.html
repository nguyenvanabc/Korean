      color: #202124;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    h1 {
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      background: #1a73e8;
      color: white;
    }

    button:hover {
      opacity: .9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .logout {
      background: #666;
    }

    .save {
      background: #188038;
      font-size: 17px;
      font-weight: bold;
      padding: 14px 24px;
    }

    .user {
      margin: 12px 0;
      color: #555;
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f1f3f4;
      border-radius: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 13px;
      min-height: 80px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }

    .stat {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
    }

    .stat-number {
      font-size: 25px;
      font-weight: bold;
    }

    .stat-label {
      color: #666;
      margin-top: 5px;
      font-size: 13px;
    }

    .success {
      color: #137333;
    }

    .error {
      color: #c5221f;
    }

    .warning {
      color: #b06000;
    }

    .data-preview {
      max-height: 400px;
      overflow: auto;
      background: #202124;
      color: #eee;
      padding: 15px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

  function calculateDuration(start, end) {

    if (!start || !end) return null;

    const [sh, sm] = start.split(":").map(Number);
    const [eh, em] = end.split(":").map(Number);

    return (eh * 60 + em) - (sh * 60 + sm);
  }

  /* =========================================================

     ========================================================= */

  async function saveTripSettings(batch) {

    const ref =
      doc(
        db,
        "trips",
        TRIP_ID,
        "settings",
        "main"
      );

    batch.set(
      ref,
      {
        ...tripSettings,

        updatedAt: serverTimestamp(),
        updatedBy: userMeta()
      },
      {

  /* =========================================================
     FIRESTORE BATCH SAVE
     ========================================================= */

  async function saveAllData() {

    if (!currentUser) {

      alert("Vui lòng đăng nhập trước.");

      return;
    }


    btnSave.disabled = true;

    statusBox.className = "status";

    statusBox.textContent =
      "Đang chuẩn bị dữ liệu...\n";


    try {

      /*
       * Firestore batch giới hạn 500 writes.
       *
       * Hiện tại dữ liệu của chúng ta < 500,
       * nên có thể lưu thành một batch.
       */

      let batch = writeBatch(db);

      let writeCount = 0;


      saveMetadata(batch);
      writeCount++;


      saveTripSettings(batch);
      writeCount++;


      saveActivities(batch);
      writeCount += activities.length;


      saveMilestones(batch);
      writeCount += milestones.length;


      saveDSP(batch);

      writeCount +=
        1 + dspAttractions.length;


      saveNotes(batch);
      writeCount++;


      statusBox.textContent +=
        `Đã chuẩn bị ${writeCount} document.\n`;

      statusBox.textContent +=
        "Đang ghi vào Firestore...\n";


      await batch.commit();


      statusBox.className =
        "status success";


      statusBox.textContent =
        `✓ SAVE THÀNH CÔNG\n\n` +

        `Trip: ${TRIP_ID}\n` +

        `Activities: ${activities.length}\n` +

        `Milestones: ${milestones.length}\n` +

        `DSP attractions: ${dspAttractions.length}\n` +

        `Tổng writes: ${writeCount}\n\n` +

        `Người lưu: ${currentUser.email}\n\n` +

        `Dữ liệu đã được lưu vào Firestore.`;

    }

    catch (error) {

      console.error(error);

      statusBox.className =
        "status error";

      statusBox.textContent =
        "✕ SAVE THẤT BẠI\n\n" +
        error.message;

    }

    finally {

      btnSave.disabled = false;

    }

  }

    (user) => {

      currentUser = user;

      if (user) {

        loginSection.classList.add(

        );

        userSection.classList.remove(
          "hidden"
        );

        appSection.classList.remove(
          "hidden"
        );

        userInfo.textContent =
