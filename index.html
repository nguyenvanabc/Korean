<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Firebase Auth Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f4f6f8;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #6b7280;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }

    input {
      width: 100%;
      margin-top: 7px;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #c7d2fe;
      border-color: #818cf8;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button.secondary {
      background: #e5e7eb;
      color: #172033;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f3f4f6;
      line-height: 1.5;
    }

    .success {
      background: #ecfdf5;
      color: #047857;
    }

    .error {
      background: #fef2f2;
      color: #b91c1c;
    }

    .user-info {
      margin-top: 20px;
      padding: 16px;
      background: #f9fafb;
      border-radius: 12px;
    }

    .user-info div {
      margin-bottom: 10px;
    }

    .user-info div:last-child {
      margin-bottom: 0;
    }

    .label {
      display: block;
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 3px;
    }

    .value {
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    details {
      margin-top: 20px;
      color: #6b7280;
      font-size: 13px;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 420px) {
      .card {
        padding: 22px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Firebase Auth Test</h1>

    <p class="subtitle">
      Test Firebase Authentication trước khi xây Seoul Trip Companion.
    </p>

    <!-- LOGIN -->
    <div id="loginSection">

      <label>
        Email
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        >
      </label>

      <label>
        Mật khẩu
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Ít nhất 6 ký tự"
        >
      </label>

      <div class="buttons">

        <button id="loginButton">
          Đăng nhập
        </button>

        <button id="registerButton" class="secondary">
          Tạo tài khoản
        </button>

      </div>

    </div>


    <!-- LOGGED IN -->
    <div id="userSection" class="hidden">

      <div class="status success">
        ✓ Firebase Authentication hoạt động
      </div>

      <div class="user-info">

        <div>
          <span class="label">Email</span>
          <span id="userEmail" class="value"></span>
        </div>

        <div>
          <span class="label">Firebase UID</span>
          <span id="userUid" class="value"></span>
        </div>

      </div>

      <div style="margin-top:18px">

        <button id="logoutButton" class="secondary">
          Đăng xuất
        </button>

      </div>

    </div>


    <!-- MESSAGE -->
    <div id="message" class="status hidden"></div>


    <!-- DEBUG -->
    <details>

      <summary>Debug information</summary>

      <pre id="debug"></pre>

    </details>

  </div>
</div>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCoHYgOL4hAs4ECxz8iMrc8d9458dOth3Q",
    authDomain: "seol-8eb80.firebaseapp.com",
    projectId: "seol-8eb80",
    storageBucket: "seol-8eb80.firebasestorage.app",
    messagingSenderId: "545533388832",
    appId: "1:545533388832:web:441dad1a09916bb14eb445",
    measurementId: "G-MZQ5L465GV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const loginSection = document.getElementById("loginSection");
  const userSection = document.getElementById("userSection");
  const userInfo = document.getElementById("userInfo");
  const message = document.getElementById("message");

  loginBtn.addEventListener("click", async () => {
    message.textContent = "Đang đăng nhập...";

    try {
      await signInWithPopup(auth, provider);
    } catch (error) {
      console.error(error);
      message.textContent = "Đăng nhập thất bại: " + error.message;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    try {
      await signOut(auth);
      message.textContent = "Đã đăng xuất.";
    } catch (error) {
      console.error(error);
      message.textContent = "Đăng xuất thất bại.";
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.hidden = true;
      userSection.hidden = false;

      userInfo.innerHTML = `
        <div><strong>${user.displayName || "Google User"}</strong></div>
        <div>${user.email || ""}</div>
        <div class="uid">UID: ${user.uid}</div>
      `;

      message.textContent = "Đăng nhập thành công.";
    } else {
      loginSection.hidden = false;
      userSection.hidden = true;
      userInfo.innerHTML = "";
    }
  });
</script>
</body>
</html>
