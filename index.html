<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#111827" />
  <title>Seoul Trip Companion · 2026</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #e5e7eb;
      --primary: #111827;
      --blue: #2563eb;
      --green: #15803d;
      --orange: #c2410c;
      --red: #b91c1c;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(15, 23, 42, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- LOGIN ---------- */

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: min(440px, 100%);
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      margin: 12px 0 8px;
    }

    /* ---------- HEADER ---------- */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner,
    .nav,
    main {
      max-width: 1250px;
      margin: auto;
    }

    .topbar-inner {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-weight: 800;
      font-size: 16px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    /* ---------- NAV ---------- */

    .nav {
      padding: 0 18px 10px;
      display: flex;
      gap: 5px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .nav button.active {
      background: #eef2ff;
      color: #3730a3;
      font-weight: 700;
    }

    /* ---------- COMMON ---------- */

    main {
      padding: 20px 18px 80px;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 6px;
      letter-spacing: -.025em;
    }

    h1 {
      font-size: 26px;
    }

    h2 {
      font-size: 19px;
    }

    h3 {
      font-size: 16px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn.blue {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .btn.green {
      color: var(--green);
    }

    .btn.danger {
      color: var(--red);
    }

    .btn.block {
      width: 100%;
      justify-content: center;
    }

    .pill {
      display: inline-flex;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill.green {
      background: #dcfce7;
      color: #166534;
    }

    .pill.orange {
      background: #ffedd5;
      color: #9a3412;
    }

    .pill.red {
      background: #fee2e2;
      color: #b91c1c;
    }

    .pill.gray {
      background: #f1f5f9;
      color: #475569;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
    }

    .stat strong {
      font-size: 24px;
    }

    .progress {
      height: 9px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--blue);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px;
    }

    /* ---------- TIMELINE ---------- */

    .timeline {
      margin-top: 8px;
    }

    .activity {
      display: grid;
      grid-template-columns: 82px 1fr auto;
      gap: 12px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .activity:first-child {
      border-top: 0;
    }

    .activity-time {
      font-weight: 800;
      color: #334155;
    }

    .activity-title {
      font-weight: 750;
    }

    .activity-place {
      color: var(--muted);
      font-size: 12px;
    }

    .activity-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .fixed .activity-title::before {
      content: "🔒 ";
    }

    .flexible .activity-title::before {
      content: "◇ ";
    }

    /* Today timeline states */
    .tl-item {
      display: grid;
      grid-template-columns: 28px 64px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
      align-items: start;
    }

    .tl-item:first-child {
      border-top: 0;
    }

    .tl-item.done {
      opacity: 0.55;
    }

    .tl-item.current {
      background: #eef2ff;
      margin: 0 -12px;
      padding-left: 12px;
      padding-right: 12px;
      border-radius: 10px;
      border-top-color: transparent;
    }

    .tl-item.skipped {
      opacity: 0.4;
      text-decoration: line-through;
    }

    .tl-mark {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.4;
      text-align: center;
    }

    .tl-time {
      font-weight: 700;
      font-size: 13px;
      color: #334155;
    }

    .tl-title {
      font-weight: 700;
      font-size: 14px;
    }

    .tl-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ---------- DAY TABS ---------- */

    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .day-tabs .active {
      background: #111827;
      color: white;
    }

    /* ---------- DAY MAP ---------- */

    .day-map-wrap {
      margin-top: 12px;
      margin-bottom: 4px;
    }

    #dayMap {
      height: 280px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      z-index: 1;
    }

    .day-map-distances {
      margin-top: 10px;
      font-size: 13px;
    }

    .day-map-distances .dist-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed var(--line);
      gap: 8px;
    }

    .day-map-distances .dist-row:last-child {
      border-bottom: 0;
    }

    .day-map-distances .dist-total {
      margin-top: 8px;
      font-weight: 700;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    .day-map-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.4;
      margin: 10px 12px;
    }

    .leaflet-popup-content b {
      font-size: 14px;
    }

    .leaflet-popup-content .popup-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .leaflet-popup-content .popup-actions a {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #1e293b;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }

    .numbered-marker {
      background: #2563eb;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    /* ---------- NOW CARD / I'M HERE ---------- */

    .now-card {
      background: linear-gradient(135deg, #111827 0%, #1e3a5f 100%);
      color: white;
      border: 0;
    }

    .now-card .muted {
      color: rgba(255,255,255,.7);
    }

    .now-card h2 {
      color: white;
    }

    .now-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .75;
      margin-bottom: 4px;
    }

    .here-result {
      margin-top: 12px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .here-result strong {
      font-size: 16px;
    }

    /* ---------- QUICK ADD FAB ---------- */

    .fab {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 0;
      background: var(--primary);
      color: white;
      font-size: 28px;
      font-weight: 300;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .3);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .fab:active {
      transform: scale(0.96);
    }

    .quick-sheet {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .quick-sheet button {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      font-size: 15px;
    }

    /* ---------- FORMS ---------- */

    .form {
      display: grid;
      gap: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 9px 10px;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* ---------- LIST ---------- */

    .list-item {
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }

    .list-item:first-child {
      border-top: 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* ---------- MODAL ---------- */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15,23,42,.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0;
    }

    @media (min-width: 640px) {
      .modal {
        align-items: center;
        padding: 18px;
      }
    }

    .modal-box {
      width: min(620px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 18px 18px 0 0;
      padding: 18px;
    }

    @media (min-width: 640px) {
      .modal-box {
        border-radius: 18px;
      }
    }

    .close-btn {
      border: 0;
      background: #f1f5f9;
      border-radius: 9px;
      width: 34px;
      height: 34px;
      font-size: 20px;
    }

    /* ---------- TOAST ---------- */

    .toast {
      position: fixed;
      right: 18px;
      bottom: 80px;
      z-index: 100;
      background: #111827;
      color: white;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      max-width: calc(100vw - 36px);
    }

    .error {
      margin-top: 12px;
      padding: 10px;
      color: var(--red);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .grid-2,
      .grid-3,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        display: block;
      }

      .hero .actions {
        margin-top: 10px;
      }

      .activity {
        grid-template-columns: 68px 1fr;
      }

      .activity > .actions {
        grid-column: 2;
      }

      #dayMap {
        height: 240px;
      }

      main {
        padding-bottom: 90px;
      }
    }
  
    /* ===== MOBILE-FIRST BOTTOM NAV ===== */
    :root {
      --nav-h: 64px;
      --safe-b: env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      background: rgba(255,255,255,.97);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-top: 1px solid var(--line);
      padding-bottom: var(--safe-b);
      display: flex;
      justify-content: space-around;
      align-items: stretch;
      height: calc(var(--nav-h) + var(--safe-b));
      max-width: 1250px;
      margin: 0 auto;
    }
    .bottom-nav button {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 2px;
      font-size: 10px;
      font-weight: 600;
      min-width: 0;
    }
    .bottom-nav button .ico { font-size: 20px; line-height: 1; }
    .bottom-nav button.active { color: #3730a3; }
    .fab {
      bottom: calc(var(--nav-h) + var(--safe-b) + 12px) !important;
    }
    .toast {
      bottom: calc(var(--nav-h) + var(--safe-b) + 70px) !important;
    }
    main {
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 24px) !important;
    }
    .status-banner {
      padding: 10px 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .status-banner.green { background: #dcfce7; color: #166534; }
    .status-banner.yellow { background: #fef9c3; color: #a16207; }
    .status-banner.red { background: #fee2e2; color: #b91c1c; }
    .status-banner.gray { background: #f1f5f9; color: #475569; }
    .free-window {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 10px;
      margin-top: 6px;
      font-size: 13px;
    }
    .impact-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      font-size: 13px;
    }
    .impact-box.warn { background: #fef2f2; border-color: #fecaca; }
    .impact-row { padding: 6px 0; border-bottom: 1px dashed #e5e7eb; }
    .impact-row:last-child { border-bottom: 0; }
    /* Hide top nav on mobile, show bottom */
    @media (max-width: 767px) {
      .nav { display: none !important; }
    }
    @media (min-width: 768px) {
      .bottom-nav { display: none !important; }
      .fab { bottom: 24px !important; right: 24px !important; }
      .toast { bottom: 90px !important; }
    }
    .modal {
      align-items: flex-end !important;
      padding: 0 !important;
    }
    .modal-box {
      border-radius: 18px 18px 0 0 !important;
      max-height: 88dvh !important;
      width: 100% !important;
      max-width: 560px !important;
      padding-bottom: calc(16px + var(--safe-b)) !important;
    }
    @media (min-width: 640px) {
      .modal { align-items: center !important; padding: 16px !important; }
      .modal-box { border-radius: 18px !important; }
    }
    input, select, textarea { font-size: 15px !important; }

  
    /* ===== LAYOUT FIXES (mobile) ===== */
    .tl-item {
      grid-template-columns: 22px 48px minmax(0, 1fr) !important;
      gap: 6px !important;
      align-items: start;
    }
    .tl-body { min-width: 0; overflow: hidden; }
    .tl-title {
      font-size: 13px;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .tl-meta {
      font-size: 11px;
      word-break: break-word;
    }
    .tl-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .tl-time { font-size: 11px; }
    .activity {
      grid-template-columns: 52px minmax(0, 1fr) !important;
      gap: 8px !important;
    }
    .activity > .actions {
      grid-column: 1 / -1 !important;
      margin-top: 4px;
    }
    .activity-title, .activity-place, .activity-note {
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .row {
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .row > div { min-width: 0; }
    .hero h1 { font-size: 20px !important; word-break: break-word; }
    .now-card .grid-2 {
      grid-template-columns: 1fr !important;
      gap: 12px;
    }
    .card { overflow: hidden; }
    .pill { max-width: 100%; }
    .stat strong { font-size: 18px !important; word-break: break-word; }
    .list-item .row {
      flex-wrap: wrap;
    }
    .list-item .actions {
      width: 100%;
      margin-top: 6px;
      justify-content: flex-start;
    }
    .bottom-nav button {
      font-size: 9px !important;
      line-height: 1.15;
      padding: 4px 1px !important;
    }
    .bottom-nav button .ico { font-size: 18px !important; }
    main {
      padding-left: 12px !important;
      padding-right: 12px !important;
      padding-bottom: calc(var(--nav-h, 64px) + var(--safe-b, 0px) + 28px) !important;
      overflow-x: hidden;
    }
    .day-tabs .btn { flex-shrink: 0; }
    .status-banner {
      font-size: 13px !important;
      word-break: break-word;
    }
    .grid-3 {
      grid-template-columns: 1fr 1fr !important;
    }
    @media (max-width: 380px) {
      .grid-3 { grid-template-columns: 1fr !important; }
      .tl-item { grid-template-columns: 20px minmax(0, 1fr) !important; }
      .tl-time { grid-column: 2; }
    }

  
    #dayMap {
      background: #e2e8f0;
      min-height: 240px;
    }
    .leaflet-tile-container img {
      /* slightly smoother on mobile */
    }

  </style>
</head>

<body>

<!-- =========================================================
     LOGIN
========================================================= -->

<div id="loginView" class="login-screen">
  <div class="login-card">
    <span class="pill blue">SEOUL 2026</span>

    <h1>Seoul Trip Companion</h1>

    <p class="muted">
      Lịch trình · DSP · Chi tiêu · Địa điểm
    </p>

    <button id="loginBtn" class="btn primary" style="width:100%">
      Đăng nhập bằng Google
    </button>

    <div id="loginError" class="error hidden"></div>
  </div>
</div>


<!-- =========================================================
     APP
========================================================= -->

<div id="appView" class="hidden">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        Seoul Trip Companion
        <small>18–25/10/2026 · Seoul</small>
      </div>

      <div class="user-area">

        <img
          id="avatar"
          class="avatar hidden"
          alt=""
        />

        <span id="userName"></span>

        <button id="logoutBtn" class="btn">
          Thoát
        </button>

      </div>

    </div>


    <nav class="nav" id="nav">

      <button
        data-tab="dashboard"
        class="active"
      >
        Today
      </button>

      <button data-tab="itinerary">
        Lịch trình
      </button>

/**
 * Haversine distance in km (as-the-crow-flies).
 */
function haversineKm(lat1, lng1, lat2, lng2) {
  const toRad = deg => (deg * Math.PI) / 180;
  const R = 6371;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLng / 2) *
      Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}


function haversineM(lat1, lng1, lat2, lng2) {
  return haversineKm(lat1, lng1, lat2, lng2) * 1000;
}

function tripDays() {
  const days = [];
  const start = new Date(TRIP_START + "T12:00:00");
  const end = new Date(TRIP_END + "T12:00:00");
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    days.push(`${y}-${m}-${day}`);
  }
  // also include any activity dates outside range
  for (const a of state.activities) {
    if (a.date && !days.includes(a.date)) days.push(a.date);
  }
  return days.sort();
}

function classifyDayActivities(day, now = new Date()) {
  const dayStr = day;
  const todayStr = localDateString(now);
  const nowMin = localTimeMinutes(now);

  const list = activeActivities()
    .filter(a => a.date === dayStr)
    .slice()
    .sort((a, b) => {
      const orderA = a.order != null ? Number(a.order) : Infinity;
      const orderB = b.order != null ? Number(b.order) : Infinity;
      if (orderA !== orderB) return orderA - orderB;
      return String(a.startTime || "").localeCompare(String(b.startTime || ""));
    });

  return list.map(a => {
    const status = String(a.status || "").toLowerCase();
    if (status === "done" || status === "completed") {
      return { activity: a, state: "done" };
    }
    if (status === "skipped") {
      return { activity: a, state: "skipped" };
    }

    // Only use clock for the actual calendar day
    if (dayStr !== todayStr) {
      if (dayStr < todayStr) return { activity: a, state: "done" };
      return { activity: a, state: "upcoming" };
    }

    const start = minutes(a.startTime);
    const end = minutes(a.endTime) || start + 60;

    if (nowMin >= end) return { activity: a, state: "done" };
    if (nowMin >= start && nowMin < end) return { activity: a, state: "current" };
    return { activity: a, state: "upcoming" };
  });
}


function getDayMapPoints(day) {
  const dayActivities = activeActivities()
    .filter(a => a.date === day)
    .slice()
    .sort((a, b) => {
      const orderA = a.order != null ? Number(a.order) : Infinity;
      const orderB = b.order != null ? Number(b.order) : Infinity;
      if (orderA !== orderB) return orderA - orderB;
      return String(a.startTime || "").localeCompare(String(b.startTime || ""));
    });

  const points = [];

  for (const activity of dayActivities) {
    if (!activity.placeId) continue;
    const place = state.places.find(p => p.id === activity.placeId);
    if (!place) continue;
    const lat = Number(place.lat);
    const lng = Number(place.lng);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    points.push({ activity, place, lat, lng });
  }

  return points;
}

  state.unsubscribe.push(

  state.unsubscribe.push(

      state._allBookings = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

  state.unsubscribe.push(
    onSnapshot(checklistRef, snapshot => {

  );

  state.unsubscribe.push(
    onSnapshot(dspRef, snapshot => {

function minsToTime(m) {
  const h = Math.floor(m / 60), mm = m % 60;
  return String(h).padStart(2,"0") + ":" + String(mm).padStart(2,"0");
}
function dayBufferMinutes(day) {
  return activeActivities().filter(a => a.date === day)
    .reduce((s, a) => s + (Number(a.bufferMinutesAfter) || 0), 0);
}
function freeWindows(day) {
  const list = activeActivities().filter(a => a.date === day).slice()
    .sort((a,b) => String(a.startTime||"").localeCompare(String(b.startTime||"")));
  const windows = [];
  for (let i = 0; i < list.length - 1; i++) {
    const endA = minutes(list[i].endTime) || minutes(list[i].startTime) + 60;
    const startB = minutes(list[i+1].startTime);
    const gap = startB - endA;
    if (gap >= 15) {
      windows.push({
        from: minsToTime(endA), to: minsToTime(startB), minutes: gap,
        after: list[i].title, before: list[i+1].title
      });
    }
  }
  return windows;
}
function scheduleHealth(day, now = new Date()) {
  const classified = (typeof classifyDayActivities === "function")
    ? classifyDayActivities(day, now)
    : [];
  // Fallback simple health if classify not available at call time
  const todayStr = localDateString(now);
  if (day !== todayStr) {
    return { level: "gray", text: day < todayStr ? "Ngày đã qua" : "Ngày sắp tới" };
  }
  const nowMin = localTimeMinutes(now);
  const dayActs = activeActivities().filter(a => a.date === day)
    .sort((a,b) => String(a.startTime||"").localeCompare(String(b.startTime||"")));
  for (const a of dayActs) {
    const st = String(a.status||"").toLowerCase();
    if (st === "done" || st === "skipped") continue;
    const start = minutes(a.startTime);
    const end = minutes(a.endTime) || start + 60;
    if (nowMin >= start && nowMin < end) {
      return { level: "green", text: "🟢 Đúng lịch · " + (a.title||"") };
    }
    if (nowMin > start + 10 && nowMin < start) { /* noop */ }
    if (a.mode === "fixed" && nowMin > start + 10 && nowMin < end) {
      /* already in */
    }
    if (a.mode === "fixed" && nowMin > end && st !== "done") {
      /* past */
    }
  }
  // upcoming
  for (const a of dayActs) {
    const st = String(a.status||"").toLowerCase();
    if (st === "done" || st === "skipped") continue;
    const start = minutes(a.startTime);
    if (nowMin < start) {
      const until = start - nowMin;
      if (until <= 15) return { level: "yellow", text: "🟡 Sắp tới: " + (a.title||"") + " (" + until + "p)" };
      return { level: "green", text: "🟢 On schedule · còn " + until + "p" };
    }
    if (nowMin >= start && nowMin < (minutes(a.endTime)||start+60)) {
      return { level: "green", text: "🟢 Đúng lịch" };
    }
  }
  if (dayActs.length) return { level: "green", text: "🟢 Xong ngày / giữa các slot" };
  return { level: "gray", text: "Chưa có lịch" };
}

function analyzeImpact(newAct) {
  const day = newAct.date;
  const newStart = minutes(newAct.startTime);
  const newEnd = minutes(newAct.endTime) || newStart + 60;
  const existing = activeActivities().filter(a => a.date === day)
    .sort((a,b) => String(a.startTime||"").localeCompare(String(b.startTime||"")));
  const effects = [];
  let hasFixedConflict = false;
  for (const a of existing) {
    const aStart = minutes(a.startTime);
    const aEnd = minutes(a.endTime) || aStart + 60;
    if (newStart < aEnd && newEnd > aStart) {
      if (a.mode === "fixed") hasFixedConflict = true;
      effects.push(a.mode === "fixed"
        ? "⚠ Xung đột FIXED: " + a.title + " (" + a.startTime + "–" + a.endTime + ")"
        : "Chồng giờ flexible: " + a.title + " (" + a.startTime + "–" + a.endTime + ")");
    } else if (aStart >= newEnd) {
      effects.push("Activity sau: " + a.title + " lúc " + a.startTime + " · gap " + (aStart - newEnd) + "p");
      break;
    }
  }
  for (let i = existing.length - 1; i >= 0; i--) {
    const a = existing[i];
    const aEnd = minutes(a.endTime) || minutes(a.startTime) + 60;
    if (aEnd <= newStart) {
      const gap = newStart - aEnd;
      const travel = Number(a.travelMinutesToNext) || 0;
      effects.unshift("Trước đó: " + a.title + " · gap " + gap + "p" + (travel ? " · travel " + travel + "p" : ""));
      if (travel && gap < travel) effects.unshift("⚠ Gap " + gap + "p < travelMinutesToNext " + travel + "p");
      break;
    }
  }
  return { effects, hasFixedConflict };
}

   PHASE 3 — I'M HERE (Geolocation)
========================================================= */

function runImHere() {
  const slot = document.getElementById("hereResultSlot");
  if (!slot) {
    // Open on dashboard
    state.tab = "dashboard";
    document.querySelector('[data-tab="dashboard"]').click();
    setTimeout(runImHere, 100);
    return;
  }

  slot.innerHTML = `
    <div class="card" style="margin-top:14px">
      <div class="muted">Đang lấy vị trí…</div>
    </div>
  `;

  if (!navigator.geolocation) {
    slot.innerHTML = `
      <div class="card" style="margin-top:14px">
        <div class="error">Trình duyệt không hỗ trợ Geolocation.</div>
      </div>
    `;
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude, longitude, accuracy } = pos.coords;

      const withCoords = state.places.filter(p => {
        const lat = Number(p.lat);
        const lng = Number(p.lng);
        return Number.isFinite(lat) && Number.isFinite(lng);
      });

      if (!withCoords.length) {
        slot.innerHTML = `
          <div class="card" style="margin-top:14px">
            <div class="muted">Không có Place nào có tọa độ trong Firestore.</div>
          </div>
        `;
        return;
      }

      let nearest = null;
      let nearestM = Infinity;

      for (const place of withCoords) {
        const d = haversineM(latitude, longitude, Number(place.lat), Number(place.lng));
        if (d < nearestM) {
          nearestM = d;
          nearest = place;
        }
      }

      const distLabel =
        nearestM < 1000
          ? `${Math.round(nearestM)} m`
          : `${(nearestM / 1000).toFixed(2)} km`;

      const google =
        nearest.googleMapsUrl ||
        `https://www.google.com/maps/search/?api=1&query=${nearest.lat},${nearest.lng}`;
      const naver =
        nearest.naverMapsUrl ||
        `https://map.naver.com/p/search/${encodeURIComponent(nearest.name || "")}`;

      slot.innerHTML = `
        <div class="card here-result" style="margin-top:14px">
          <div class="now-label" style="color:var(--muted)">📍 Bạn đang gần</div>
          <strong>${escapeHtml(nearest.name || "—")}</strong>
          <div class="small muted" style="margin-top:4px">
            Khoảng cách (đường chim bay): <b>${distLabel}</b>
            ${accuracy ? ` · GPS ±${Math.round(accuracy)} m` : ""}
          </div>
          <div class="actions" style="margin-top:10px">
            <button class="btn" onclick="window.open('${escapeHtml(google)}','_blank')">Google Maps</button>
            <button class="btn" onclick="window.open('${escapeHtml(naver)}','_blank')">Naver Map</button>
          </div>
        </div>
      `;
    },
    err => {
      let msg = "Không lấy được vị trí.";
      if (err.code === 1) msg = "Bạn đã từ chối quyền vị trí.";
      if (err.code === 2) msg = "Vị trí không khả dụng.";
      if (err.code === 3) msg = "Hết thời gian chờ GPS.";
      slot.innerHTML = `
        <div class="card" style="margin-top:14px">

      `;
    },
    { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
  );
}

/* =========================================================
   DAY MAP (Phase 1)
========================================================= */

function destroyDayMap() {
  if (dayMap) {
    try { dayMap.remove(); } catch (_) {}
    dayMap = null;
    dayMapLayerGroup = null;
  }
}


function renderDayMapDistances(points) {
  const container = document.getElementById("dayMapDistances");
  if (!container) return;

  if (points.length < 2) {
    container.innerHTML = points.length === 0
      ? `<div class="muted small">Không có địa điểm có tọa độ để hiển thị trên bản đồ.</div>`
      : `<div class="muted small">Chỉ 1 địa điểm — chưa có đoạn khoảng cách.</div>`;
    return;
  }

  let total = 0;
  const rows = [];

  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i];
    const b = points[i + 1];
    const d = haversineKm(a.lat, a.lng, b.lat, b.lng);
    total += d;
    rows.push(`
      <div class="dist-row">
        <span>
          ${i + 1} → ${i + 2}
          <span class="muted"> · ${escapeHtml(a.place.name)} → ${escapeHtml(b.place.name)}</span>
        </span>
        <strong>${d.toFixed(1)} km</strong>
      </div>
    `);
  }

  container.innerHTML = `
    ${rows.join("")}
    <div class="dist-total">Tổng khoảng cách trực tiếp: ${total.toFixed(1)} km</div>
    <div class="day-map-note">
      Khoảng cách tính từ tọa độ / đường chim bay — không phải khoảng cách đi bộ hay tuyến đường thực tế.
    </div>
  `;
}


function initOrUpdateDayMap(day) {
  const mapEl = document.getElementById("dayMap");
  if (!mapEl) return;

  const points = getDayMapPoints(day);
  const defaultCenter = [37.5665, 126.9780];

  // #dayMap bị thay mỗi lần render itinerary → phải tạo map mới sạch
  if (dayMap) {
    try { dayMap.remove(); } catch (_) {}
    dayMap = null;
    dayMapLayerGroup = null;
  }
  // Xóa state Leaflet còn sót trên DOM node
  if (mapEl._leaflet_id) {
    try { delete mapEl._leaflet_id; } catch (_) { mapEl._leaflet_id = undefined; }
  }
  mapEl.innerHTML = "";

  dayMap = L.map(mapEl, {
    zoomControl: true,
    attributionControl: true,
    preferCanvas: true,
    fadeAnimation: false,
    zoomAnimation: true
  });

  // Tile ổn định hơn tile.openstreetmap.org (CDN Carto, data OSM, miễn phí)
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 20,
    subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> · CARTO',
    updateWhenIdle: true,
    keepBuffer: 2,
    errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
  }).addTo(dayMap);

  dayMapLayerGroup = L.layerGroup().addTo(dayMap);

  const latLngs = [];
  points.forEach((pt, index) => {
    const num = index + 1;
    const icon = L.divIcon({
      className: "",
      html: `<div class="numbered-marker">${num}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });
    const marker = L.marker([pt.lat, pt.lng], { icon }).addTo(dayMapLayerGroup);
    const timeStr = [pt.activity.startTime || "", pt.activity.endTime || ""]
      .filter(Boolean).join(" – ");
    const googleUrl = pt.place.googleMapsUrl ||
      `https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}`;
    const naverUrl = pt.place.naverMapsUrl ||
      (pt.place.name ? `https://map.naver.com/p/search/${encodeURIComponent(pt.place.name)}` : null);
    let popupHtml = `<b>${escapeHtml(pt.place.name || "—")}</b><br>
      <span style="color:#64748b">${escapeHtml(timeStr || "—")}</span>`;
    if (pt.activity.notes) {
      popupHtml += `<br><span style="color:#64748b;font-size:12px">${escapeHtml(pt.activity.notes)}</span>`;
    }
    const links = [];
    if (googleUrl) links.push(`<a href="${escapeHtml(googleUrl)}" target="_blank" rel="noopener">Google Maps</a>`);
    if (naverUrl) links.push(`<a href="${escapeHtml(naverUrl)}" target="_blank" rel="noopener">Naver Map</a>`);
    if (links.length) popupHtml += `<div class="popup-actions">${links.join("")}</div>`;
    marker.bindPopup(popupHtml);
    latLngs.push([pt.lat, pt.lng]);
  });

  if (latLngs.length >= 2) {
    L.polyline(latLngs, {
      color: "#2563eb", weight: 3, opacity: 0.75, dashArray: "6 8"
    }).addTo(dayMapLayerGroup);
  }

  if (latLngs.length === 0) {
    dayMap.setView(defaultCenter, 11);
  } else if (latLngs.length === 1) {
    dayMap.setView(latLngs[0], 14);
  } else {
    dayMap.fitBounds(latLngs, { padding: [36, 36], maxZoom: 15 });
  }

  // Container mobile thường layout chậm → invalidateSize lặp
  const fixSize = () => { if (dayMap) dayMap.invalidateSize({ animate: false }); };
  requestAnimationFrame(fixSize);
  setTimeout(fixSize, 100);
  setTimeout(fixSize, 350);
  setTimeout(fixSize, 800);

  renderDayMapDistances(points);
}

function renderDSP() {

  if (state.dspMain?.expiresAt) {

function placeListHtml(places) {
  if (!places.length) {
    return `<div class="empty">Không tìm thấy.</div>`;

  return places.map(place => `

      <div class="row">
        <div>
          <b>${escapeHtml(place.name)}</b>
          <div class="small muted">
            ${place.lat != null ? place.lat : "—"},

        </div>
        <div class="actions">
          ${mapButtons(place.id)}

    </div>

}

async function loadPlanningNote() {
  try {
    const snapshot = await import(
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
    ).then(module => module.getDocs(notesRef));

    const note = snapshot.docs.find(d => d.id === "planning");
    if (note) {
      const textarea = document.getElementById("planningNote");
      if (textarea) textarea.value = note.data().text || "";
    }
  } catch (error) {
    console.error(error);
  }
}


async function savePlanningNote() {
  const text = document.getElementById("planningNote").value;
  await setDoc(
    doc(db, "trips", TRIP_ID, "notes", "planning"),
    { text, ...audit() },
    { merge: true }
  );
  showToast("Đã lưu ghi chú");
}


async function exportJson() {
  const data = {
    tripId: TRIP_ID,
    exportedAt: new Date().toISOString(),
    activities: state.activities,
    places: state.places,
    expenses: state.expenses,
    bookings: state._allBookings || state.bookings,
    checklist: state.checklist,
    dsp: state.dsp,
    dspMain: state.dspMain
  };

  const blob = new Blob([JSON.stringify(data, null, 2)], {
    type: "application/json"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "seoul-2026-backup.json";
  link.click();
  URL.revokeObjectURL(url);
}

    // Append to planning note
    try {
      const { getDoc } = await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      );
      const ref = doc(db, "trips", TRIP_ID, "notes", "planning");
      const snap = await getDoc(ref);
      const prev = snap.exists() ? (snap.data().text || "") : "";
      await setDoc(ref, { text: prev + line, ...audit() }, { merge: true });
      closeModal();
      showToast("Đã lưu ghi chú");
    } catch (err) {
      alert(err.message);
    }
  };
}


document.getElementById("quickAddFab").onclick = openQuickAdd;


/* =========================================================
   RENDER + NOW TIMER
========================================================= */

function render() {
  if (!state.user) return;

  renderDashboard();
  renderItinerary();
  renderDSP();
  renderExpenses();
  renderPlaces();
  renderMore();

  // Wire DSP mini button if present
  const goDsp = document.getElementById("goDspMini");
  if (goDsp) {
    goDsp.onclick = () => {
      state.tab = "dsp";
      document.querySelector('[data-tab="dsp"]').click();
    };
  }
}



/** Cảnh báo 15–30 phút trước activity (ưu tiên fixed). Toast 1 lần / activity / ngưỡng. */
function checkUpcomingAlerts() {
  const now = new Date();
  const todayStr = localDateString(now);
  if (todayStr < TRIP_START || todayStr > TRIP_END) return;
  const nowMin = localTimeMinutes(now);
  const list = (typeof activeActivities === "function" ? activeActivities() : state.activities)
    .filter(a => a.date === todayStr);
  for (const a of list) {
    const st = String(a.status || "").toLowerCase();
    if (st === "done" || st === "skipped" || st === "deleted") continue;
    const start = minutes(a.startTime);
    if (!Number.isFinite(start)) continue;
    const minsUntil = start - nowMin;
    if (minsUntil > 30 || minsUntil < 1) continue;
    const key = todayStr + ":" + a.id + ":" + (minsUntil <= 15 ? "15" : "30");
    if (state.alertedIds[key]) continue;
    state.alertedIds[key] = true;
    const label = minsUntil <= 15 ? ("còn " + minsUntil + " phút") : ("còn ~" + minsUntil + " phút");
    const mode = a.mode === "fixed" ? "🔒 " : "";
    showToast(mode + "Sắp tới: " + (a.title || "Activity") + " (" + label + ")");
    const banner = document.getElementById("upcomingAlertBanner");
    if (banner) {
      banner.className = "status-banner yellow";
      banner.textContent = mode + "Sắp tới · " + (a.title || "Activity") + " · " + label + " · " + (a.startTime || "");
      banner.style.display = "";
    }
  }
}

async function loadDayNote(day) {
  try {
    const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    const snap = await getDoc(doc(db, "trips", TRIP_ID, "notes", "day-" + day));
    const text = snap.exists() ? (snap.data().text || "") : "";
    state.dayNoteText = text;
    const el = document.getElementById("dayNoteInput");
    if (el && document.activeElement !== el) el.value = text;
  } catch (e) { console.error(e); }
}

function startNowTimer() {
  stopNowTimer();
  nowTimer = setInterval(() => {
    state.nowTick = Date.now();
    try { checkUpcomingAlerts(); } catch (_) {}
    // Only soft-refresh dashboard if visible — avoid full map rebuild
    if (state.tab === "dashboard" && state.user) {
      renderDashboard();
      const goDsp = document.getElementById("goDspMini");
      if (goDsp) {
        goDsp.onclick = () => {
          state.tab = "dsp";
          document.querySelector('[data-tab="dsp"]').click();
        };
      }
    }
  }, 30000);
}


function stopNowTimer() {
  if (nowTimer) {
    clearInterval(nowTimer);
    nowTimer = null;
  }
}


/* =========================================================
   AUTH
========================================================= */

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    const element = document.getElementById("loginError");
    element.textContent = error.message;
    element.classList.remove("hidden");
  }
};


document.getElementById("logoutBtn").onclick = () => signOut(auth);


onAuthStateChanged(auth, user => {
  state.user = user;

  document.getElementById("loginView").classList.toggle("hidden", !!user);
  document.getElementById("appView").classList.toggle("hidden", !user);

  if (!user) {
    state.unsubscribe.forEach(unsub => unsub?.());
    state.unsubscribe = [];
    destroyDayMap();
    stopNowTimer();
    return;
  }

  document.getElementById("userName").textContent =
    user.displayName || user.email || "";

  if (user.photoURL) {
    const avatar = document.getElementById("avatar");
    avatar.src = user.photoURL;
    avatar.classList.remove("hidden");
  }

  subscribeFirestore();
  startNowTimer();
  render();
});
