<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>Seoul Trip Companion · 2026</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --line: #e5e7eb;
      --primary: #111827;
      --blue: #2563eb;
      --green: #15803d;
      --orange: #c2410c;
      --red: #b91c1c;
      --radius: 16px;
      --shadow: 0 8px 30px rgba(15, 23, 42, .07);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- LOGIN ---------- */

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .login-card {
      width: min(440px, 100%);
      background: white;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 32px;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      margin: 12px 0 8px;
    }

    /* ---------- HEADER ---------- */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner,
    .nav,
    main {
      max-width: 1250px;
      margin: auto;
    }

    .topbar-inner {
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      font-weight: 800;
      font-size: 16px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }

    /* ---------- NAV ---------- */

    .nav {
      padding: 0 18px 10px;
      display: flex;
      gap: 5px;
      overflow-x: auto;
    }

    .nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 13px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .nav button.active {
      background: #eef2ff;
      color: #3730a3;
      font-weight: 700;
    }

    /* ---------- COMMON ---------- */

    main {
      padding: 20px 18px 60px;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 6px;
      letter-spacing: -.025em;
    }

    h1 {
      font-size: 26px;
    }

    h2 {
      font-size: 19px;
    }

    h3 {
      font-size: 16px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 650;
    }

    .btn.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn.blue {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    .btn.green {
      color: var(--green);
    }

    .btn.danger {
      color: var(--red);
    }

    .pill {
      display: inline-flex;
      padding: 4px 8px;
      border-radius: 999px;
      background: #f1f5f9;
      font-size: 11px;
      font-weight: 700;
    }

    .pill.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .pill.green {
      background: #dcfce7;
      color: #166534;
    }

    .pill.orange {
      background: #ffedd5;
      color: #9a3412;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 10px;
    }

    .stat strong {
      font-size: 24px;
    }

    .progress {
      height: 9px;
      background: #e5e7eb;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress i {
      display: block;
      height: 100%;
      background: var(--blue);
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 28px;
    }

    /* ---------- TIMELINE ---------- */

    .timeline {
      margin-top: 8px;
    }

    .activity {

      gap: 12px;
      padding: 12px 0;

    .activity-place {

      font-size: 12px;
    }

    .activity-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .fixed .activity-title::before {
      content: "🔒 ";

    .flexible .activity-title::before {
      content: "◇ ";

    /* ---------- DAY TABS ---------- */

    .day-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .day-tabs .active {
      background: #111827;
      color: white;
    }

    }

    .day-map-distances {

      font-size: 13px;

      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed var(--line);
    }

    .day-map-distances .dist-row:last-child {
      border-bottom: 0;
    }

    .day-map-distances .dist-total {
      margin-top: 8px;
      font-weight: 700;
      padding-top: 6px;
      border-top: 1px solid var(--line);
    }

    .day-map-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .leaflet-popup-content {
      font-size: 13px;
      line-height: 1.4;
      margin: 10px 12px;
    }

    .leaflet-popup-content b {

    }

    .leaflet-popup-content .popup-actions {

      padding: 4px 8px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #1e293b;

      font-size: 12px;
      font-weight: 600;

      background: #2563eb;
      color: white;
      border: 2px solid white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }

    /* ---------- FORMS ---------- */

    .form {
      display: grid;
      gap: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    label {
      display: grid;
      gap: 5px;
      color: #475569;
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 9px 10px;
      background: white;
      color: var(--text);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    /* ---------- LIST ---------- */

    .list-item {
      padding: 11px 0;
      border-top: 1px solid var(--line);
    }

    .list-item:first-child {
      border-top: 0;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* ---------- MODAL ---------- */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15,23,42,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal-box {
      width: min(620px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
      padding: 18px;
    }

    .close-btn {
      border: 0;
      background: #f1f5f9;
      border-radius: 9px;
      width: 34px;
      height: 34px;
      font-size: 20px;
    }

    /* ---------- TOAST ---------- */

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 100;
      background: #111827;
      color: white;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
    }

    .error {
      margin-top: 12px;
      padding: 10px;
      color: var(--red);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .grid-2,
      .grid-3,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        display: block;
      }

      .hero .actions {
        margin-top: 10px;
      }

      .activity {
        grid-template-columns: 68px 1fr;
      }

      .activity > .actions {
        grid-column: 2;
      }

      #dayMap {
        height: 240px;
      }
    }
  </style>
</head>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {

/* =========================================================
   FIREBASE
========================================================= */

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyCoHYgOL4hAs4ECxz8iMrc8d9458dOth3Q",
  authDomain: "seol-8eb80.firebaseapp.com",
  projectId: "seol-8eb80",
  storageBucket: "seol-8eb80.firebasestorage.app",
  messagingSenderId: "545533388832",
  appId: "1:545533388832:web:441dad1a09916bb14eb445",
  measurementId: "G-MZQ5L465GV"
};
const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

const db = getFirestore(app);


/* =========================================================
   CONSTANTS
========================================================= */

const TRIP_ID = "seoul-2026";

const tripRef = collection(
  db,
  "trips",
  TRIP_ID,
  "activities"
);

const placesRef = collection(
  db,
  "trips",
  TRIP_ID,
  "places"
);

const expensesRef = collection(
  db,
  "trips",
  TRIP_ID,
  "expenses"
);

const dspRef = collection(
  db,
  "trips",
  TRIP_ID,
  "dsp"
);

const notesRef = collection(
  db,
  "trips",
  TRIP_ID,
  "notes"
);


/* =========================================================
   STATE
========================================================= */

const state = {

  user: null,

  tab: "dashboard",

  selectedDay: "2026-10-18",

  activities: [],

  places: [],

  expenses: [],

  dsp: [],

  dspMain: null,

  unsubscribe: []

};

/** Leaflet map instance for Day Map (itinerary tab) */
let dayMap = null;
let dayMapLayerGroup = null;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[char]));

}


function money(value) {

  return new Intl.NumberFormat("ko-KR")
    .format(Number(value) || 0) + " ₩";

}


function minutes(time) {

  if (!time) return 0;

  const [h, m] = time.split(":").map(Number);

  return h * 60 + m;

}


function formatDay(date) {

  return new Intl.DateTimeFormat(
    "vi-VN",
    {
      weekday: "short",
      day: "2-digit",
      month: "2-digit"
    }
  ).format(
    new Date(date + "T12:00:00")
  );

}


function placeName(id) {

  const place = state.places.find(
    p => p.id === id
  );

  return place?.name || id || "—";

}


function showToast(message) {

  const element =
    document.getElementById("toast");

  element.textContent = message;

  element.classList.remove("hidden");

  clearTimeout(window.__toastTimer);

  window.__toastTimer =
    setTimeout(() => {
      element.classList.add("hidden");
    }, 2200);

}


function audit() {

  return {

    updatedAt: new Date().toISOString(),

    updatedBy: {
      uid: state.user?.uid || "",
      name: state.user?.displayName || "",
      email: state.user?.email || ""
    }

  };

}


/**
 * Haversine distance in km between two lat/lng points.
 * Pure geometry — as-the-crow-flies, not routing.
 */
function haversineKm(lat1, lng1, lat2, lng2) {

  const toRad = deg => (deg * Math.PI) / 180;

  const R = 6371; // Earth radius km

  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) *
      Math.cos(toRad(lat2)) *
      Math.sin(dLng / 2) *
      Math.sin(dLng / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;

}


/**
 * Build ordered list of map points for a given day.
 * Only includes activities that have a place with valid lat/lng.
 * Numbering is sequential among those points only.
 */
function getDayMapPoints(day) {

  const dayActivities = state.activities
    .filter(a => a.date === day)
    .slice()
    .sort((a, b) => {
      // Prefer explicit order if present, else startTime
      const orderA = a.order != null ? Number(a.order) : Infinity;
      const orderB = b.order != null ? Number(b.order) : Infinity;
      if (orderA !== orderB) return orderA - orderB;
      return String(a.startTime || "").localeCompare(String(b.startTime || ""));
    });

  const points = [];

  for (const activity of dayActivities) {

    if (!activity.placeId) continue;

    const place = state.places.find(p => p.id === activity.placeId);

    if (!place) continue;

    const lat = Number(place.lat);
    const lng = Number(place.lng);

    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;

    points.push({
      activity,
      place,
      lat,
      lng
    });

  }

  return points;

}


/* =========================================================
   MODAL
========================================================= */

function openModal(title, html) {

  document.getElementById(
    "modalTitle"
  ).textContent = title;

  document.getElementById(
    "modalBody"
  ).innerHTML = html;

  document.getElementById(

}


function closeModal() {

  document.getElementById(
    "modal"
  ).classList.add("hidden");

}


document.getElementById(
  "modalClose"
).onclick = closeModal;


document.getElementById(
  "modal"
).onclick = event => {

  if (event.target.id === "modal") {
    closeModal();
  }

};


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll("#nav button")
  .forEach(button => {

    button.onclick = () => {

      state.tab = button.dataset.tab;

      document
        .querySelectorAll("#nav button")
        .forEach(btn => {

          btn.classList.toggle(
            "active",
            btn === button
          );

        });

      [
        "dashboard",
        "itinerary",
        "dsp",
        "expenses",
        "places",
        "more"
      ].forEach(tab => {

        document
          .getElementById("tab-" + tab)
          .classList.toggle(
            "hidden",
            tab !== state.tab
          );

      });

      render();

    };

  });


/* =========================================================
   FIRESTORE REALTIME
========================================================= */

function subscribeFirestore() {

  state.unsubscribe.forEach(
    unsubscribe => unsubscribe?.()
  );

  state.unsubscribe = [];


  state.unsubscribe.push(

    onSnapshot(
      tripRef,
      snapshot => {

        state.activities =
          snapshot.docs
            .map(doc => ({
              id: doc.id,
              ...doc.data()
            }))
            .sort((a, b) =>
              (
                a.date +
                a.startTime
              ).localeCompare(
                b.date +
                b.startTime
              )
            );

        render();

      }

    )

  );


  state.unsubscribe.push(

    onSnapshot(
      placesRef,
      snapshot => {

        state.places =
          snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

        render();

      }

    )

  );


  state.unsubscribe.push(

    onSnapshot(
      expensesRef,
      snapshot => {

        state.expenses =
          snapshot.docs.map(doc => ({
            id: doc.id,
            ...doc.data()
          }));

        render();

      }

    )

  );


  state.unsubscribe.push(

    onSnapshot(
      dspRef,
      snapshot => {

        state.dsp =
          snapshot.docs

            .map(doc => ({
              id: doc.id,
              ...doc.data()
            }))

            .filter(
              item => item.id !== "main"
            );


        const main =
          snapshot.docs.find(
            doc => doc.id === "main"
          );

        state.dspMain =
          main?.data() || null;

        render();

      }

    )

  );

}


/* =========================================================
   MAP BUTTONS
========================================================= */

function mapButtons(placeId) {

/* =========================================================
   DAY MAP (Leaflet + OSM)
========================================================= */

function destroyDayMap() {

  if (dayMap) {
    dayMap.remove();
    dayMap = null;
    dayMapLayerGroup = null;
  }

}


function renderDayMapDistances(points) {

  const container = document.getElementById("dayMapDistances");

  if (!container) return;

  if (points.length < 2) {

    container.innerHTML = points.length === 0
      ? `<div class="muted small">Không có địa điểm có tọa độ để hiển thị trên bản đồ.</div>`
      : `<div class="muted small">Chỉ 1 địa điểm — chưa có đoạn khoảng cách.</div>`;

    return;

  }

  let total = 0;
  const rows = [];

  for (let i = 0; i < points.length - 1; i++) {

    const a = points[i];
    const b = points[i + 1];
    const d = haversineKm(a.lat, a.lng, b.lat, b.lng);
    total += d;

    const fromNum = i + 1;
    const toNum = i + 2;

    rows.push(`
      <div class="dist-row">
        <span>
          ${fromNum} → ${toNum}
          <span class="muted"> · ${escapeHtml(a.place.name)} → ${escapeHtml(b.place.name)}</span>
        </span>
        <strong>${d.toFixed(1)} km</strong>
      </div>
    `);

  }

  container.innerHTML = `
    ${rows.join("")}
    <div class="dist-total">
      Tổng khoảng cách trực tiếp: ${total.toFixed(1)} km
    </div>
    <div class="day-map-note">
      Khoảng cách tính từ tọa độ / đường chim bay — không phải khoảng cách đi bộ hay tuyến đường thực tế.
    </div>
  `;

}


function initOrUpdateDayMap(day) {

  const mapEl = document.getElementById("dayMap");

  if (!mapEl) return;

  const points = getDayMapPoints(day);

  // Destroy previous instance if DOM was re-rendered
  if (dayMap) {
    try {
      dayMap.remove();
    } catch (_) { /* ignore */ }
    dayMap = null;
    dayMapLayerGroup = null;
  }

  // Default center: Seoul (only used when no points)
  const defaultCenter = [37.5665, 126.9780];

  dayMap = L.map(mapEl, {
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(dayMap);

  dayMapLayerGroup = L.layerGroup().addTo(dayMap);

  const latLngs = [];

  points.forEach((pt, index) => {

    const num = index + 1;

    const icon = L.divIcon({
      className: "",
      html: `<div class="numbered-marker">${num}</div>`,
      iconSize: [28, 28],
      iconAnchor: [14, 14],
      popupAnchor: [0, -14]
    });

    const marker = L.marker([pt.lat, pt.lng], { icon }).addTo(dayMapLayerGroup);

    const timeStr = [
      pt.activity.startTime || "",
      pt.activity.endTime || ""
    ].filter(Boolean).join(" – ");

    const googleUrl =
      pt.place.googleMapsUrl ||
      (Number.isFinite(pt.lat) && Number.isFinite(pt.lng)
        ? `https://www.google.com/maps/search/?api=1&query=${pt.lat},${pt.lng}`
        : null);

    const naverUrl =
      pt.place.naverMapsUrl ||
      (pt.place.name
        ? `https://map.naver.com/p/search/${encodeURIComponent(pt.place.name)}`
        : null);

    let popupHtml = `
      <b>${escapeHtml(pt.place.name || "—")}</b><br>
      <span style="color:#64748b">${escapeHtml(timeStr || "—")}</span>
    `;

    if (pt.activity.notes) {
      popupHtml += `<br><span style="color:#64748b;font-size:12px">${escapeHtml(pt.activity.notes)}</span>`;
    }

    const links = [];
    if (googleUrl) {
      links.push(`<a href="${escapeHtml(googleUrl)}" target="_blank" rel="noopener">Google Maps</a>`);
    }
    if (naverUrl) {
      links.push(`<a href="${escapeHtml(naverUrl)}" target="_blank" rel="noopener">Naver Map</a>`);
    }

    if (links.length) {
      popupHtml += `<div class="popup-actions">${links.join("")}</div>`;
    }

    marker.bindPopup(popupHtml);

    latLngs.push([pt.lat, pt.lng]);

  });

  if (latLngs.length >= 2) {

    L.polyline(latLngs, {
      color: "#2563eb",
      weight: 3,
      opacity: 0.75,
      dashArray: "6 8"
    }).addTo(dayMapLayerGroup);

  }

  if (latLngs.length === 0) {

    dayMap.setView(defaultCenter, 11);

  } else if (latLngs.length === 1) {

    dayMap.setView(latLngs[0], 14);

  } else {

    dayMap.fitBounds(latLngs, { padding: [36, 36], maxZoom: 15 });

  }

  // Leaflet needs a size invalidate after DOM insertion
  setTimeout(() => {
    if (dayMap) dayMap.invalidateSize();
  }, 80);

  renderDayMapDistances(points);

}

        id="addExpense"
      >
        + Khoản chi
      </button>

    </div>


    <div class="grid grid-3">

      ${[
        "food",
        "transport",
        "shopping"
      ].map(category => `

        <div class="card">

          <div class="small muted">
            ${category}
          </div>

          <h2>
            ${money(
              state.expenses
                .filter(
                  item =>
                    item.category ===
                    category
                )
                .reduce(
                  (sum, item) =>
                    sum +
                    Number(
                      item.amount || 0
                    ),
                  0
                )
            )}
          </h2>

        </div>

      `).join("")}

    </div>


    <div
      class="card"
      style="margin-top:14px"
    >

      ${
        state.expenses.length

          ? state.expenses
              .sort(
                (a,b) =>
                  String(b.date)
                    .localeCompare(
                      String(a.date)
                    )
              )
              .map(item => `

                <div class="list-item">

                  <div class="row">

                    <div>

                      <b>
                        ${escapeHtml(
                          item.description
                        )}
                      </b>

                      <div class="small muted">

                        ${escapeHtml(
                          item.date || ""
                        )}

                        ·

                        ${escapeHtml(
                          item.category || ""
                        )}

                        ${
                          item.payer
                            ? " · " +
                              escapeHtml(
                                item.payer
                              )
                            : ""
                        }

                      </div>

                    </div>


                    <div class="actions">

                      <strong>
                        ${money(
                          item.amount
                        )}
                      </strong>

                      <button
                        class="btn danger"
                        onclick="removeExpense(
                          '${escapeHtml(
                            item.id
                          )}'
                        )"
                      >
                        Xóa
                      </button>

                    </div>

                  </div>

                </div>

              `).join("")

          : `
            <div class="empty">
              Chưa có khoản chi.
            </div>
          `
      }

    </div>

  `;


  document.getElementById(
    "addExpense"
  ).onclick =
    openExpenseForm;

}


function openExpenseForm() {

  openModal(

    "Thêm khoản chi",

    `

      <form
        id="expenseForm"
        class="form"
      >

        <div class="form-grid">

          <label>

            Ngày

            <input
              type="date"
              name="date"
              value="${state.selectedDay}"
              required
            >

          </label>


          <label>

            Số tiền KRW

            <input
              type="number"
              name="amount"
              min="0"
              required
            >

          </label>

        </div>


        <div class="form-grid">

          <label>

            Danh mục

            <select name="category">

              <option value="food">
                food
              </option>

              <option value="transport">
                transport
              </option>

              <option value="shopping">
                shopping
              </option>

              <option value="ticket">
                ticket
              </option>

              <option value="other">
                other
              </option>

            </select>

          </label>


          <label>

            Người trả

            <input
              name="payer"
              placeholder="Tôi / Vợ"
            >

          </label>

        </div>


        <label>

          Mô tả

          <input
            name="description"
            required
            placeholder="Ví dụ: ăn trưa..."
          >

        </label>


        <button
          class="btn primary"
        >
          Lưu
        </button>

      </form>

    `
  );


  document.getElementById(
    "expenseForm"
  ).onsubmit =
    async event => {

      event.preventDefault();

      const data =
        Object.fromEntries(
          new FormData(
            event.target
          ).entries()
        );

      data.amount =
        Number(data.amount);


      await addDoc(
        expensesRef,
        {
          ...data,
          ...audit()
        }
      );


      closeModal();

      showToast(
        "Đã thêm khoản chi"
      );

    };

}


window.removeExpense =
  async function(id) {

    if (
      !confirm(
        "Xóa khoản chi?"
      )
    ) return;


    await deleteDoc(
      doc(
        db,
        "trips",
        TRIP_ID,
        "expenses",
        id
      )
    );

  };


/* =========================================================
   PLACES
========================================================= */

function renderPlaces() {

  const element =
    document.getElementById(
      "tab-places"
    );


  element.innerHTML = `

    <div class="hero">

      <div>

        <span class="pill">
          PLACES
        </span>

        <h1>
          Địa điểm
        </h1>

        <div class="muted">
          ${state.places.length}
          địa điểm
        </div>

      </div>

    </div>


    <div class="card">

      <input
        id="placeSearch"
        placeholder="Tìm địa điểm..."
      >


      <div
        id="placeList"
        style="margin-top:8px"
      >

        ${placeListHtml(
          state.places
        )}

      </div>

    </div>

  `;


  document.getElementById(
    "placeSearch"
  ).oninput = event => {

    const keyword =
      event.target.value
        .toLowerCase()
        .trim();


    document.getElementById(
      "placeList"
    ).innerHTML =
      placeListHtml(
        state.places.filter(
          place =>
            place.name
              .toLowerCase()
              .includes(keyword)
        )
      );

  };

}


function placeListHtml(places) {

  if (!places.length) {

    return `
      <div class="empty">
        Không tìm thấy.
      </div>
    `;

  }


  return places.map(place => `

    <div class="list-item">

      <div class="row">

        <div>

          <b>
            ${escapeHtml(
              place.name
            )}
          </b>

          <div class="small muted">
            ${place.lat},
            ${place.lng}
          </div>

        </div>


        <div class="actions">

          ${mapButtons(place.id)}

        </div>

      </div>

    </div>

  `).join("");

}


/* =========================================================
   MORE
========================================================= */

function renderMore() {

  const element =
    document.getElementById(
      "tab-more"
    );


  element.innerHTML = `

    <div class="hero">

      <div>

        <span class="pill">
          TOOLS
        </span>

        <h1>
          Khác
        </h1>

        <div class="muted">
          Backup và ghi chú.
        </div>

      </div>

    </div>


    <div class="grid grid-2">

      <div class="card">

        <h2>
          📝 Ghi chú chuyến đi
        </h2>

        <textarea
          id="planningNote"
          placeholder="Ghi chú chung..."
        ></textarea>

        <button
          id="saveNote"
          class="btn primary"
          style="margin-top:8px"
        >
          Lưu
        </button>

      </div>


      <div class="card">

        <h2>
          💾 Backup
        </h2>

        <p class="muted small">
          Xuất dữ liệu hiện tại thành
          file JSON.
        </p>

        <button
          id="exportJson"
          class="btn"
        >
          Export JSON
        </button>

      </div>

    </div>

  `;


  loadPlanningNote();


  document.getElementById(
    "saveNote"
  ).onclick =
    savePlanningNote;


  document.getElementById(
    "exportJson"
  ).onclick =
    exportJson;

}


async function loadPlanningNote() {

  try {

    const snapshot =
      await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      ).then(module =>
        module.getDocs(
          notesRef
        )
      );


    const note =
      snapshot.docs.find(
        doc =>
          doc.id === "planning"
      );


    if (note) {

      const textarea =
        document.getElementById(
          "planningNote"
        );

      if (textarea) {

        textarea.value =
          note.data().text || "";

      }

    }

  } catch (error) {

    console.error(error);

  }

}


async function savePlanningNote() {

  const text =
    document.getElementById(
      "planningNote"
    ).value;


  await setDoc(
    doc(
      db,
      "trips",
      TRIP_ID,
      "notes",
      "planning"
    ),
    {
      text,
      ...audit()
    },
    {
      merge: true
    }
  );


  showToast(
    "Đã lưu ghi chú"
  );

}


async function exportJson() {

  const data = {

    tripId: TRIP_ID,

    exportedAt:
      new Date().toISOString(),

    activities:
      state.activities,

    places:
      state.places,

    expenses:
      state.expenses,

    dsp:
      state.dsp,

    dspMain:
      state.dspMain

  };


  const blob =
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    "seoul-2026-backup.json";

  link.click();

  URL.revokeObjectURL(url);

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  if (!state.user) return;

  renderDashboard();

  renderItinerary();

  renderDSP();

  renderExpenses();

  renderPlaces();

  renderMore();

}


/* =========================================================
   AUTH
========================================================= */

document.getElementById(
  "loginBtn"
).onclick = async () => {

  try {

    await signInWithPopup(
      auth,
      provider
    );

  } catch (error) {

    const element =
      document.getElementById(
        "loginError"
      );

    element.textContent =
      error.message;

    element.classList.remove(
      "hidden"
    );

  }

};


document.getElementById(
  "logoutBtn"
).onclick = () =>
  signOut(auth);


/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  user => {

    state.user = user;


    document
      .getElementById("loginView")
      .classList.toggle(
        "hidden",
        !!user
      );


    document
      .getElementById("appView")
      .classList.toggle(
        "hidden",
        !user
      );


    if (!user) {

      state.unsubscribe
        .forEach(
          unsubscribe =>
            unsubscribe?.()
        );

      state.unsubscribe = [];

      destroyDayMap();

      return;

    }


    document.getElementById(
      "userName"
    ).textContent =
      user.displayName ||
      user.email ||
      "";


    if (user.photoURL) {

      const avatar =
        document.getElementById(
          "avatar"
        );

      avatar.src =
        user.photoURL;

      avatar.classList.remove(
        "hidden"
      );

    }


    subscribeFirestore();

    render();

  }
);

</script>
