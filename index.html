let currentView = 'overview', currentDayId = null, mapInstance = null, mapAllInstance = null;
let checked = JSON.parse(localStorage.getItem('korea-checked') || '{}');
let filterDay = 'all', filterType = 'all';

function saveChecked(){ localStorage.setItem('korea-checked', JSON.stringify(checked)); updateProgress(); }
function updateProgress(){
  let total=0,done=0;
  DAYS.forEach(d=>d.items.forEach((_,i)=>{total++;if(checked[`${d.id}-${i}`])done++;}));
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress-circle').style.strokeDashoffset=97.4-(97.4*pct/100);
  document.getElementById('progress-text').textContent=pct+'%';
}
function formatDate(s){const d=new Date(s+'T12:00:00'),days=['CN','T2','T3','T4','T5','T6','T7'];return `${d.getDate()}/${d.getMonth()+1} (${days[d.getDay()]})`;}
function isToday(s){const t=new Date(),d=new Date(s+'T12:00:00');return t.toDateString()===d.toDateString();}
function naverUrl(p){return `https://map.naver.com/v5/search/${encodeURIComponent(p.naver||p.nameKo||p.name)}`;}

function renderOverview(){
  const list=document.getElementById('days-list');
  list.innerHTML=DAYS.map(day=>{
    const done=day.items.filter((_,i)=>checked[`${day.id}-${i}`]).length,total=day.items.length,isTod=isToday(day.date);
    return `<button class="day-card w-full text-left bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 hover:shadow-md transition ${isTod?'ring-2 ring-primary-500':''}" data-day="${day.id}">
      <div class="flex items-start gap-3">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl flex-shrink-0" style="background:${day.color}20">${day.emoji}</div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 flex-wrap">
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full" style="background:${day.color}20;color:${day.color}">Ngày ${day.id}</span>
            <span class="text-xs text-slate-500">${formatDate(day.date)}</span>
            ${isTod?'<span class="text-[10px] bg-primary-500 text-white px-1.5 py-0.5 rounded-full">Hôm nay</span>':''}
          </div>
          <h3 class="font-semibold mt-1 truncate">${day.title}</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 line-clamp-1">${day.summary}</p>
          <div class="mt-2 flex items-center gap-2">
            <div class="flex-1 h-1.5 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden"><div class="h-full rounded-full" style="width:${total?done/total*100:0}%;background:${day.color}"></div></div>
            <span class="text-[10px] text-slate-500">${done}/${total}</span>
          </div>
        </div>
        <svg class="w-5 h-5 text-slate-400 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </div>
    </button>`;
  }).join('');
  list.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>showDay(+b.dataset.day)));
}

function showDay(dayId){
  currentDayId=dayId;
  const day=DAYS.find(d=>d.id===dayId); if(!day)return;
  document.getElementById('view-overview').classList.add('hidden');
  document.getElementById('view-place').classList.add('hidden');
  document.getElementById('view-mapall').classList.add('hidden');
  document.getElementById('view-day').classList.remove('hidden');
  currentView='day';
  document.getElementById('day-header').innerHTML=`<div class="flex items-center gap-3 mb-1"><span class="text-3xl">${day.emoji}</span><div><div class="text-xs font-semibold" style="color:${day.color}">Ngày ${day.id} · ${formatDate(day.date)}</div><h2 class="text-xl font-bold">${day.title}</h2></div></div><p class="text-sm text-slate-500 dark:text-slate-400">${day.summary}</p>`;
  const timeline=document.getElementById('day-timeline');
  timeline.innerHTML=day.items.map((item,idx)=>{
    const key=`${day.id}-${idx}`,isChecked=checked[key];
    const icon={transport:'🚇',food:'🍜',sight:'📸',shop:'🛍️',rest:'😴'}[item.type]||'•';
    return `<div class="timeline-item pb-5 ${isChecked?'checked opacity-70':''}"><div class="timeline-dot"></div>
      <div class="flex items-start gap-2">
        <button class="check-btn mt-0.5 w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition ${isChecked?'bg-green-500 border-green-500 text-white':'border-slate-300 dark:border-slate-600'}" data-key="${key}">${isChecked?'<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>':''}</button>
        <div class="flex-1 min-w-0">
          <div class="flex items-baseline gap-2 flex-wrap"><span class="text-xs font-mono font-medium text-slate-500">${item.time}</span><span class="text-sm">${icon}</span></div>
          <h4 class="font-medium text-sm mt-0.5 ${isChecked?'line-through':''}">${item.title}</h4>
          ${item.desc?`<p class="text-xs text-slate-500 mt-0.5">${item.desc}</p>`:''}
          ${item.duration?`<p class="text-xs text-slate-400 mt-0.5">${item.duration}</p>`:''}
          ${item.placeId?`<button class="place-link mt-1 text-xs font-medium text-primary-600 dark:text-primary-400 underline" data-place="${item.placeId}">Xem thông tin điểm →</button>`:''}
        </div>
      </div></div>`;
  }).join('');
  timeline.querySelectorAll('.check-btn').forEach(btn=>btn.addEventListener('click',e=>{e.stopPropagation();checked[btn.dataset.key]=!checked[btn.dataset.key];saveChecked();showDay(dayId);}));
  timeline.querySelectorAll('.place-link').forEach(btn=>btn.addEventListener('click',()=>showPlace(btn.dataset.place,dayId)));
  setTimeout(()=>initDayMap(day),40);
}

function initDayMap(day){
  const container=document.getElementById('map');
  if(mapInstance){mapInstance.remove();mapInstance=null;}
  container.innerHTML='';
  const places=day.items.filter(i=>i.placeId&&PLACES[i.placeId]).map(i=>({...PLACES[i.placeId],id:i.placeId}));
  if(!places.length){container.innerHTML='<div class="h-full flex items-center justify-center text-sm text-slate-400">Không có điểm trên bản đồ</div>';return;}
  mapInstance=L.map('map',{zoomControl:false}).setView([places[0].lat,places[0].lng],12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(mapInstance);
  const bounds=[];
  places.forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{radius:8,fillColor:day.color,color:'#fff',weight:2,fillOpacity:0.9}).addTo(mapInstance);
    m.bindPopup(`<b>${p.name}</b><br><button onclick="showPlace('${p.id}',${day.id})" class="text-sky-600 text-xs underline">Chi tiết</button>`);
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length>1)mapInstance.fitBounds(bounds,{padding:[30,30]});
  L.control.zoom({position:'bottomright'}).addTo(mapInstance);
}

function showPlace(placeId,fromDayId){
  const place=PLACES[placeId]; if(!place)return;
  document.getElementById('view-day').classList.add('hidden');
  document.getElementById('view-overview').classList.add('hidden');
  document.getElementById('view-mapall').classList.add('hidden');
  document.getElementById('view-place').classList.remove('hidden');
  currentView='place';
  document.getElementById('place-content').innerHTML=`
    <div class="place-img rounded-2xl h-36 flex items-center justify-center mb-4"><span class="text-5xl opacity-50">📍</span></div>
    <h2 class="text-xl font-bold">${place.name}</h2>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">${place.nameKo||''}</p>
    <div class="mt-4 space-y-3 text-sm">
      <div class="flex gap-3"><span class="text-slate-400 w-20 flex-shrink-0">Địa chỉ</span><span>${place.address}</span></div>
      <div class="flex gap-3"><span class="text-slate-400 w-20 flex-shrink-0">Giờ mở</span><span>${place.hours}</span></div>
      <div class="flex gap-3"><span class="text-slate-400 w-20 flex-shrink-0">Giá vé</span><span>${place.fee}</span></div>
    </div>
    ${place.history?`<div class="mt-4 p-4 bg-amber-50 dark:bg-amber-900/20 rounded-xl"><h3 class="text-sm font-semibold text-amber-800 dark:text-amber-300 mb-1">📜 Lịch sử & Văn hóa</h3><p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${place.history}</p></div>`:''}
    <div class="mt-3 p-4 bg-primary-50 dark:bg-primary-900/20 rounded-xl"><h3 class="text-sm font-semibold text-primary-700 dark:text-primary-300 mb-1">💡 Tips thực tế</h3><p class="text-sm text-slate-700 dark:text-slate-300">${place.tips}</p></div>
    <a href="${naverUrl(place)}" target="_blank" rel="noopener" class="mt-4 flex items-center justify-center gap-2 w-full py-3.5 bg-[#03C75A] hover:bg-[#02b351] text-white font-semibold rounded-xl transition shadow-sm">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
      Chỉ đường Naver Map
    </a>
    <button id="btn-back-from-place" class="mt-3 w-full py-3 text-sm font-medium text-slate-500 dark:text-slate-400">← Quay lại lịch trình ngày</button>`;
  document.getElementById('btn-back-from-place').onclick=()=>fromDayId?showDay(fromDayId):showOverview();
}

function showOverview(){
  document.getElementById('view-day').classList.add('hidden');
  document.getElementById('view-place').classList.add('hidden');
  document.getElementById('view-mapall').classList.add('hidden');
  document.getElementById('view-overview').classList.remove('hidden');
  currentView='overview'; renderOverview();
}

function getFilteredPlaces(){
  const result=[];
  DAYS.forEach(day=>{
    if(filterDay!=='all'&&filterDay!==`day-${day.id}`)return;
    day.items.forEach(item=>{
      if(!item.placeId||!PLACES[item.placeId])return;
      if(filterType!=='all'&&item.type!==filterType)return;
      result.push({...PLACES[item.placeId],id:item.placeId,dayId:day.id,dayColor:day.color,type:item.type});
    });
  });
  const seen=new Set();
  return result.filter(p=>{if(seen.has(p.id))return false;seen.add(p.id);return true;});
}

function showMapAll(){
  document.getElementById('view-overview').classList.add('hidden');
  document.getElementById('view-day').classList.add('hidden');
  document.getElementById('view-place').classList.add('hidden');
  document.getElementById('view-mapall').classList.remove('hidden');
  currentView='mapall'; setTimeout(renderMapAll,40);
}

function renderMapAll(){
  if(mapAllInstance){mapAllInstance.remove();mapAllInstance=null;}
  const places=getFilteredPlaces();
  mapAllInstance=L.map('map-all',{zoomControl:false}).setView([37.55,127.0],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(mapAllInstance);
  const bounds=[];
  places.forEach(p=>{
    const m=L.circleMarker([p.lat,p.lng],{radius:8,fillColor:p.dayColor,color:'#fff',weight:2,fillOpacity:0.9}).addTo(mapAllInstance);
    m.bindPopup(`<b>${p.name}</b><br>Ngày ${p.dayId}<br><button onclick="showPlace('${p.id}')" class="text-sky-600 text-xs underline">Chi tiết</button>`);
    bounds.push([p.lat,p.lng]);
  });
  if(bounds.length)mapAllInstance.fitBounds(bounds,{padding:[40,40]});
  else mapAllInstance.setView([37.55,127.0],10);
  L.control.zoom({position:'bottomright'}).addTo(mapAllInstance);
  const legendDays=filterDay==='all'?DAYS:DAYS.filter(d=>filterDay===`day-${d.id}`);
  document.getElementById('map-legend').innerHTML=legendDays.map(d=>`<span class="inline-flex items-center gap-1 px-2 py-1 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"><span class="w-2.5 h-2.5 rounded-full" style="background:${d.color}"></span>Ngày ${d.id}</span>`).join('');
}

document.getElementById('btn-back-day').onclick=showOverview;
document.getElementById('btn-back-place').onclick=()=>currentDayId?showDay(currentDayId):showOverview();
document.getElementById('btn-today').onclick=()=>{const t=DAYS.find(d=>isToday(d.date));if(t)showDay(t.id);else alert('Hôm nay không nằm trong lịch 18–25/10/2026');};
document.getElementById('btn-theme').onclick=()=>{document.documentElement.classList.toggle('dark');localStorage.setItem('korea-theme',document.documentElement.classList.contains('dark')?'dark':'light');};
document.getElementById('btn-reset').onclick=()=>{if(confirm('Xóa toàn bộ check-in đã lưu?')){checked={};saveChecked();if(currentView==='day'&&currentDayId)showDay(currentDayId);else renderOverview();}};
document.querySelectorAll('.nav-btn[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('.nav-btn').forEach(b=>{b.classList.remove('text-primary-600','dark:text-primary-400');b.classList.add('text-slate-400');});
  btn.classList.remove('text-slate-400');btn.classList.add('text-primary-600','dark:text-primary-400');
  if(btn.dataset.view==='overview')showOverview();else if(btn.dataset.view==='mapall')showMapAll();
}));
document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterDay=btn.dataset.filter;if(currentView==='mapall')renderMapAll();}));
document.querySelectorAll('.type-btn').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filterType=btn.dataset.type;if(currentView==='mapall')renderMapAll();}));

if(localStorage.getItem('korea-theme')==='dark'||(!localStorage.getItem('korea-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
updateProgress();renderOverview();
window.showPlace=showPlace;
</script>
</body>
</html>
